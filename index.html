<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Custom Media Player</title>\n    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">\n    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">\n    <link rel="stylesheet" href="style.css">\n</head>\n<body>\n    <div class="main-container">\n        <div class="album-art-container">\n            <img id="cover-art" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500&h=500&fit=crop" alt="Album Art">\n            <h1 id="track-title">Track Title</h1>\n            <h2 id="track-artist">Artist Name</h2>\n        </div>\n    </div>\n\n    <div class="player-controls-container">\n        <div class="track-info-small">\n            <img id="small-cover" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=50&h=50&fit=crop" alt="Small Cover">\n            <div class="track-text">\n                <span id="small-title">Track Title</span>\n                <span id="small-artist">Artist Name</span>\n            </div>\n        </div>\n\n        <div class="center-controls">\n            <div class="playback-buttons">\n                <button id="prev-btn" class="control-btn"><i class="fas fa-step-backward"></i></button>\n                <button id="play-btn" class="control-btn play-circle"><i class="fas fa-play" id="play-icon"></i></button>\n                <button id="next-btn" class="control-btn"><i class="fas fa-step-forward"></i></button>\n            </div>\n            <div class="progress-container">\n                <span id="current-time">0:00</span>\n                <div class="progress-bar-wrapper" id="progress-container">\n                    <div class="progress-bar" id="progress"></div>\n                </div>\n                <span id="duration">0:00</span>\n            </div>\n        </div>\n\n        <div class="volume-controls">\n
